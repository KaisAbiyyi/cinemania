# Isolated local test subset, adapted from Supabase self-hosted Docker configuration
# at 412df7746e188f78597d3c80de5159590ddd69b8; see upstream/LICENSE.
name: cinematch-gh52d
services:
  db:
    image: supabase/postgres@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal", "-c", "log_statement=none"]
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate local credentials first}
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      PGPORT: 5432
      JWT_EXP: 3600
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./upstream/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./upstream/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./local-roles.sql:/docker-entrypoint-initdb.d/migrations/999-roles.sql:ro
      - ./upstream/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  realtime:
    image: public.ecr.aws/supabase/realtime@sha256:754f0429004a9b3ba98fa9907b77260ed3ecac7629f8b1a768a2e8e9a11f6c35
    hostname: realtime-dev.supabase-realtime
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        ulimit -Sn "$${RLIMIT_NOFILE:-10000}"
        /app/bin/migrate
        /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo); Ecto.Adapters.SQL.query!(Realtime.Repo, "UPDATE _realtime.tenants SET private_only = true WHERE external_id = $$1", ["realtime-dev"])'
        exec /app/bin/server
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:?generate local credentials first}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: "supabaserealtime"
      API_JWT_SECRET: ${JWT_SECRET:?generate local credentials first}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?generate local credentials first}
      METRICS_JWT_SECRET: ${JWT_SECRET:?generate local credentials first}
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "false"
      RUN_JANITOR: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
  auth:
    image: public.ecr.aws/supabase/gotrue@sha256:ba8c0c82c574756c835c696df2a2c698020cc408a42034013d3712e34de7964d
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_DISABLE_SIGNUP: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  gateway:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      realtime:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:54321:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dbdata:


