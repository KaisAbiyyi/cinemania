events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8000;
    location ^~ /realtime/v1/api/tenants { return 403; }
    location ^~ /realtime/v1/api/openapi { return 403; }
    location /realtime/v1/api/ {
      proxy_set_header Host realtime-dev.supabase-realtime;
      proxy_set_header Authorization "Bearer $http_apikey";
      proxy_pass http://realtime:4000/api/;
    }
    location /realtime/v1/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host realtime-dev.supabase-realtime;
      proxy_pass http://realtime:4000/socket/;
    }
    location / { return 404; }
  }
}
