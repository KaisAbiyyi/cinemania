name: CI

on:
  push:
    branches: [main, dev, "feat/*", "test/*"]
  pull_request:

env:
  CI: true
  TMDB_API_RAT: "mock-tmdb-offline-ci-token"
  CINEMATCH_CAPABILITY_SECRET: "ci-offline-test-capability-secret-32-bytes"
  NEXT_PUBLIC_TMDB_POSTER_URL: "https://image.tmdb.org/t/p"
  NEXT_PUBLIC_IMAGE_BASE_URL: "https://image.tmdb.org/t/p"
  IPINFO_TOKEN: "mock-ipinfo-offline-token"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (reproducible clean)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (reproducible clean)
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

  integration-tests:
    name: API Integration Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (reproducible clean)
        run: npm ci

      - name: Run API Integration Tests
        run: npm run test:integration

  local-supabase-realtime:
    name: Local Supabase Realtime Qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: scripts/local-supabase/package-lock.json

      - name: Install isolated local Supabase harness
        run: npm ci --prefix scripts/local-supabase

      - name: Run local-stack safety guards
        run: npm --prefix scripts/local-supabase run test:guards

      - name: Start loopback-only Supabase and apply exact-HEAD migrations
        run: npm --prefix scripts/local-supabase run start -- --commit "$GITHUB_SHA"

      - name: Qualify real local Realtime authorization and two-instance recovery
        run: |
          npm --prefix scripts/local-supabase run test:rls-ws
          npm --prefix scripts/local-supabase run test:two-instances

      - name: Stop isolated Supabase stack
        if: always()
        run: npm --prefix scripts/local-supabase run stop

  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    env:
      TMDB_API_RAT: "TMDB_SECRET_SENTINEL_BUILD_MARKER_999"
      SUPABASE_SECRET_KEY: "supabase-publisher-synthetic-build-sentinel"
      SUPABASE_SERVICE_ROLE_KEY: "supabase-service-role-synthetic-build-sentinel"
      SUPABASE_JWT_SECRET: "supabase-jwt-synthetic-build-sentinel"
      DATABASE_URL: "postgresql://sentinel:database-synthetic-build-sentinel@127.0.0.1:1/sentinel"
      YOUTUBE_API_KEY: "youtube-synthetic-build-sentinel"
      CINEMATCH_REQUIRE_BUNDLE_SENTINELS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies (reproducible clean)
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Verify zero server secrets in client bundle (Hard Gate)
        run: npm run test:bundle-secrets

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Cache Next.js build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies (reproducible clean)
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application
        run: npm run build

      - name: Run existing Playwright E2E tests (isolated service quota)
        run: npm run test:e2e -- --grep-invert "CINE-023 real create / invite / lobby workflow"

      - name: Run CINE-023 2-to-5 browser E2E tests (fresh service quota)
        run: npm run test:e2e -- --grep "CINE-023 real create / invite / lobby workflow"

      - name: Install CINE-026 Chromium, Firefox, and WebKit browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run CINE-026 mocked local room matrix in three browser engines
        run: npm run test:e2e -- --config=playwright.cine026.mocked.config.ts

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright failure media
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-media
          path: test-results/
          retention-days: 14

      - name: Upload Mock Request Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-logs
          path: tests/fixtures/request-logs.json
          retention-days: 14

      - name: Upload CINE-026 mocked browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cine026-mocked-playwright-report
          path: playwright-report-cine026-mocked/
          retention-days: 14
