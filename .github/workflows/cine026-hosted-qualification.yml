name: CINE-026/063 hosted staging qualification

on:
  pull_request:
    paths:
      - .github/workflows/cine026-hosted-qualification.yml
      - scripts/cine026-actions/**
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact reviewed HEAD of draft PR 66
        required: true
        type: string
      project:
        description: Exact designated staging project ref
        required: true
        type: string
      exclusive:
        description: Confirm an exclusive staging window for this invocation
        required: true
        default: false
        type: boolean
      mode:
        description: Read-only preflight, cold-start probe, one hosted gate (gate-a-only, gate-b-only, gate-c-<browser>; each starts with a bounded qualification-only Realtime warm-up), or aggregate (combines five passing one-gate runs into A-D acceptance without staging access). full (all gates in one job) is refused before any staging step
        required: true
        default: preflight
        type: choice
        options: [preflight, cold-start-probe, gate-a-only, gate-b-only, gate-c-chromium, gate-c-firefox, gate-c-webkit, aggregate, full]
      runs:
        description: aggregate only. Five comma-separated run ids (gate-a-only, gate-b-only, gate-c-chromium, gate-c-firefox, gate-c-webkit) on the same workflow SHA
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'
  CANDIDATE: 00555c03d4173ac54750677207b78252e2063257
  PROJECT: dmrbticnsczhyaiftrar

jobs:
  verify:
    name: Validate harness without staging access
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KaisAbiyyi/cinemania
          ref: ${{ env.CANDIDATE }}
          path: candidate
          persist-credentials: false
      - name: Install reviewed candidate's locked dependencies
        working-directory: candidate
        run: npm ci
      # Run after the candidate install: the declared-limit guard reads the pinned spec and the reporter test drives
      # the candidate's locked Playwright (request-only fixture, no browsers, no staging, no credentials).
      - name: Run harness tests
        run: node --test scripts/cine026-actions/qualification.test.cjs scripts/cine026-actions/cold-start-probe.test.cjs scripts/cine026-actions/realtime-warmup.test.cjs scripts/cine026-actions/workload-supervision.test.cjs scripts/cine026-actions/execution-budget.test.cjs scripts/cine026-actions/workload-progress.test.cjs scripts/cine026-actions/progress-reporter.test.cjs scripts/cine026-actions/nested-stream-tap.test.cjs scripts/cine026-actions/event-relay.test.cjs scripts/cine026-actions/aggregate.test.cjs
      - name: Verify target selection and all 39 entries without credentials
        run: node scripts/cine026-actions/qualification.cjs list
      - name: Verify live draft candidate with GitHub's read-only token
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          CINE026_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cine026-actions/qualification.cjs check-pr
      - name: Check manual dispatch consent
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_SHA: ${{ inputs.candidate }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_EXCLUSIVE: ${{ inputs.exclusive }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: node scripts/cine026-actions/qualification.cjs authorize
      # aggregate reads earlier runs' allowlisted artifacts with the read-only job token; it has no staging access.
      - name: Download evidence of the runs to aggregate
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'aggregate'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        run: |
          [[ "$RUNS" =~ ^[1-9][0-9]{0,19}(,[1-9][0-9]{0,19}){4}$ ]] || { echo "AGGREGATE_RUNS_INVALID"; exit 1; }
          for id in ${RUNS//,/ }; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n "cine026-staging-evidence-$id" -D "$RUNNER_TEMP/aggregate/$id" || echo "artifact of run $id not downloaded"
          done
      - name: Aggregate five one-gate runs into A-D acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'aggregate'
        env:
          DISPATCH_SHA: ${{ inputs.candidate }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_EXCLUSIVE: ${{ inputs.exclusive }}
          DISPATCH_MODE: ${{ inputs.mode }}
          AGGREGATE_RUN_IDS: ${{ inputs.runs }}
          AGGREGATE_DIR: ${{ runner.temp }}/aggregate
          CINE026_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cine026-actions/qualification.cjs aggregate
      - name: Upload aggregated evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'aggregate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cine026-aggregate-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/cine026-aggregate-evidence.json
          if-no-files-found: error
          retention-days: 90

  qualify:
    name: Qualify on designated staging
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'KaisAbiyyi/cinemania' &&
      github.ref == 'refs/heads/main' && github.run_attempt == '1' &&
      inputs.exclusive && inputs.mode != 'aggregate'
    environment: cine026-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: cinemania-dmrbticnsczhyaiftrar-hosted-qualification
      cancel-in-progress: false
    steps:
      - name: Record protected job budget start
        run: echo "CINE026_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KaisAbiyyi/cinemania
          ref: ${{ env.CANDIDATE }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install reviewed candidate's locked dependencies
        working-directory: candidate
        run: npm ci
      - name: Install locked Playwright browsers and system dependencies
        if: inputs.mode == 'full' || inputs.mode == 'gate-a-only' || startsWith(inputs.mode, 'gate-c-')
        working-directory: candidate
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run guarded qualification
        env:
          DISPATCH_SHA: ${{ inputs.candidate }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_EXCLUSIVE: ${{ inputs.exclusive }}
          DISPATCH_MODE: ${{ inputs.mode }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PG_HOST: ${{ vars.SUPABASE_PG_HOST }}
          SUPABASE_PG_USER: ${{ vars.SUPABASE_PG_USER }}
          CINE026_SESSION_POOL_SIZE: ${{ vars.CINE026_SESSION_POOL_SIZE }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_PG_PASSWORD: ${{ secrets.SUPABASE_PG_PASSWORD }}
        run: node scripts/cine026-actions/qualification.cjs run
      - name: Upload allowlisted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cine026-staging-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/cine026-qualification-evidence.json
          if-no-files-found: error
          retention-days: 14
